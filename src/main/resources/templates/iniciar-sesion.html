<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="form-logo">
                <img src="../static/imgs/nebula-03.svg" alt="Logo nebula">
            </div>
            <div class="form-header">
                <h3>Iniciar Sesion</h3>
                <p class="form-subtitle">Ingresa tus credenciales de acceso</p>
            </div>

            <!-- /autentication -->
            <form method="post" action="/autentication" enctype="application/x-www-form-urlencoded">
                <div class="form-group">
                    <label for="correo">Correo Electronico:</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@gmail.com"
                           required minlength="5" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="contrasenia">Contraseña: </label>
                    <input type="password" id="contrasenia" name="contrasenia"
                    placeholder="********" required minlength="8" autocomplete="off">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-primary">Iniciar sesión</button>
                    <button type="reset" class="btn-secundary">limpiar formulario</button>
                </div>
            </form>
            <p>¿No tienes una cuenta aun? <a href="registro.html">Registrarse</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
